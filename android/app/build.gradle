plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'com.virusdefense.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.virusdefense.game'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Clé de signature fixe (clé « debug » standard d'Android) : les nouvelles
    // versions s'installent par-dessus les anciennes sans tout désinstaller.
    signingConfigs {
        shared {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
